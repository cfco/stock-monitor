name: Build Releases

# 发布策略（按仓库可见性分流，不是账号级设置 —— GitHub 没有"公开仓自动发 Release"
# 这种全局开关，规则只能写在本文件里）：
#   公开仓：推 master 每次新建一条**预发布** Release（tag 形如 v5.5.0-dev.42），
#           推 tag 发正式 Release，手动触发也发。
#   私有仓：只有推 tag 或手动 workflow_dispatch 才发 Release；推 master 只构建、
#           产物留在 Actions 运行页。
# 开发构建标 prerelease + make_latest=false，所以 /releases/latest 永远指向
# 真正的正式版本，不会被开发构建抢走。
on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

# 连发多次提交时，同一 ref 上新的运行取消还在跑的旧构建，不叠加 Windows 构建；
# 被取消的那次不会留下半条 Release。分组按 ref 区分，tag 的正式发版不被分支推送打断。
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------- 先跑单测，红了我就不往下打包 ----------------
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 单测里有 Qt 控件用例（卡片布局、设置对话框、取数线程），offscreen 平台插件
      # 仍然要链接 libEGL/libGL/xcb —— 这套系统依赖此前只加在 build-linux 上，
      # test job 漏了，结果是 import PySide6.QtGui 直接崩在收集阶段
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      # 不用 -q：offscreen 下真出问题时要能直接看到回溯，而不是只有一行 exit code
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ --tb=short

  # ---------------- 发布决策：仓库可见性 + 本次要用的 tag ----------------
  # 单独跑一次算清楚，两个构建 job 只读 output：避免各查一遍 API、
  # 也避免"公开/私有怎么判"这段逻辑在两个 job 里各写一份然后漂移。
  meta:
    runs-on: ubuntu-22.04
    outputs:
      tag: ${{ steps.plan.outputs.tag }}
      name: ${{ steps.plan.outputs.name }}
      body: ${{ steps.plan.outputs.body }}
      prerelease: ${{ steps.plan.outputs.prerelease }}
      make_latest: ${{ steps.plan.outputs.make_latest }}
      notes: ${{ steps.plan.outputs.notes }}
      is_official: ${{ steps.plan.outputs.is_official }}
      visibility: ${{ steps.vis.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 账号/组织级没有"公开仓自动发 Release"的开关，可见性只能在运行时问 API 拿
      - name: Repo visibility
        id: vis
        env:
          GH_TOKEN: ${{ github.token }}
        run: echo "value=$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)" >> "$GITHUB_OUTPUT"

      # Release 的标题/正文/是否预发布全部在这里用 bash 算好，Publish 步骤只读结果：
      # Actions 的 if/三元表达式里 `cond && '' || 'x'` 会因为空串为假而走到后半段，
      # 拿这种表达式生成正式版的正文是个容易踩的坑，不如一次性在 shell 里判完。
      - name: Plan release
        id: plan
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            {
              echo "tag=$GITHUB_REF_NAME"
              echo "name=$GITHUB_REF_NAME"
              echo "body="
              echo "prerelease=false"
              echo "make_latest=true"
              echo "notes=true"
              echo "is_official=true"
            } >> "$GITHUB_OUTPUT"
          else
            # 推分支没有 tag，但 Release 必须挂在 tag 上，所以自己造一个。
            # 版本号取自 pyproject.toml（单一来源），抬版本时不用改 workflow；
            # RUN_NUMBER 单调递增，保证每次推送的 tag 互不冲突。
            version=$(grep -m1 '^version = ' pyproject.toml | sed 's/.*= "//; s/"$//')
            {
              echo "tag=v${version}-dev.${GITHUB_RUN_NUMBER}"
              echo "name=v${version}-dev.${GITHUB_RUN_NUMBER} 开发构建"
              echo "body=自动构建的开发版本，非正式发布；稳定版下载请看正式 Release。"
              echo "prerelease=true"
              echo "make_latest=false"
              echo "notes=false"
              echo "is_official=false"
            } >> "$GITHUB_OUTPUT"
          fi

  # ---------------- Windows: 单文件 EXE ----------------
  build-windows:
    needs: [test, meta]
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      # 产物里随包的默认配置必须用模板：直接用本机 scripts/watchlist_config.json
      # 会把开发者自己的自选股（含加密凭证）打进对外发布的 exe
      - name: Use template config for packaging
        shell: pwsh
        run: Copy-Item scripts/watchlist_config.example.json scripts/watchlist_config.json -Force

      - name: Build single-file exe
        run: pyinstaller --noconfirm --clean StockMonitor.spec

      - name: Smoke test (exe 能起来吗)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\StockMonitor.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "exe 启动后即退出（退出码 $($p.ExitCode)），构建产物不可用"
            exit 1
          }
          Write-Host "exe 已稳定运行 12 秒，判定启动正常"
          Stop-Process -Id $p.Id -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMonitor-exe
          path: dist/StockMonitor.exe
          if-no-files-found: error

      # 发不发：正式 tag 必发；公开仓推分支也发；私有仓只有手动触发/打 tag 才发
      - name: Publish Release
        if: >-
          needs.meta.outputs.is_official == 'true'
          || github.event_name == 'workflow_dispatch'
          || needs.meta.outputs.visibility == 'public'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          body: ${{ needs.meta.outputs.body }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.make_latest }}
          generate_release_notes: ${{ needs.meta.outputs.notes }}
          files: dist/StockMonitor.exe

  # ---------------- Linux: 单文件二进制 + tar.gz ----------------
  # 构建机选 ubuntu-22.04（glibc 2.35）：其产物可在 22.04/24.04 及 WSL 上运行；
  # 若选 24.04 构建，glibc 2.39 会导致 22.04 目标机无法运行
  build-linux:
    needs: [test, meta]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PySide6 的 Qt 图形栈在 Linux 上需要的系统库：
      #   libegl1/libgl1   —— libQt6Gui 直接链接（缺 libEGL.so.1 会在 import QtGui 时崩）
      #   libxcb-* 系列    —— xcb 平台插件的运行依赖
      #   libxkbcommon*    —— 键盘映射
      #   libdbus-1-3      —— QtNetwork/桌面集成
      # xvfb 用于无显示环境下做启动冒烟测试
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 \
            xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Use template config for packaging
        run: cp scripts/watchlist_config.example.json scripts/watchlist_config.json

      - name: Build single-file binary
        run: pyinstaller --noconfirm --clean StockMonitor.spec

      - name: Smoke test (二进制能在无显示环境起来吗)
        run: |
          xvfb-run -a bash -c '
            ./dist/StockMonitor &
            APP_PID=$!
            sleep 12
            if kill -0 $APP_PID 2>/dev/null; then
              echo "二进制已稳定运行 12 秒，判定启动正常"
              kill $APP_PID
            else
              echo "进程提前退出，构建产物不可用" >&2
              exit 1
            fi
          '

      - name: Pack tar.gz
        run: |
          tar -czf StockMonitor-linux-x64.tar.gz -C dist StockMonitor
          ls -lh StockMonitor-linux-x64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMonitor-linux
          path: StockMonitor-linux-x64.tar.gz
          if-no-files-found: error

      # 与 build-windows 同一个 tag：两个 job 并发 upsert 同一条 Release，
      # 资产名不同（exe / tar.gz）不会互相覆盖
      - name: Publish Release
        if: >-
          needs.meta.outputs.is_official == 'true'
          || github.event_name == 'workflow_dispatch'
          || needs.meta.outputs.visibility == 'public'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.meta.outputs.tag }}
          name: ${{ needs.meta.outputs.name }}
          body: ${{ needs.meta.outputs.body }}
          prerelease: ${{ needs.meta.outputs.prerelease }}
          make_latest: ${{ needs.meta.outputs.make_latest }}
          generate_release_notes: ${{ needs.meta.outputs.notes }}
          files: StockMonitor-linux-x64.tar.gz
