name: Build Releases

# 推 tag（如 v5.2.1）自动构建 Windows EXE + Linux 二进制并发布 Release；
# 也可在 Actions 页面手动触发
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # ---------------- 先跑单测，红了我就不往下打包 ----------------
  test:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest PySide6-Essentials eltdx websocket-client tzdata

      # 单测里有 Qt 控件用例（删行/回调/取数线程），无显示环境需要 offscreen 平台插件
      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest tests/ -q

  # ---------------- Windows: 单文件 EXE ----------------
  build-windows:
    needs: test
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials eltdx pyinstaller websocket-client tzdata

      # 产物里随包的默认配置必须用模板：直接用本机 scripts/watchlist_config.json
      # 会把开发者自己的自选股（含加密凭证）打进对外发布的 exe
      - name: Use template config for packaging
        shell: pwsh
        run: Copy-Item scripts/watchlist_config.example.json scripts/watchlist_config.json -Force

      - name: Build single-file exe
        run: pyinstaller --noconfirm --clean StockMonitor.spec

      - name: Smoke test (exe 能起来吗)
        shell: pwsh
        run: |
          $p = Start-Process -FilePath "dist\StockMonitor.exe" -PassThru
          Start-Sleep -Seconds 12
          if ($p.HasExited) {
            Write-Error "exe 启动后即退出（退出码 $($p.ExitCode)），构建产物不可用"
            exit 1
          }
          Write-Host "exe 已稳定运行 12 秒，判定启动正常"
          Stop-Process -Id $p.Id -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMonitor-exe
          path: dist/StockMonitor.exe
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/StockMonitor.exe
          generate_release_notes: true

  # ---------------- Linux: 单文件二进制 + tar.gz ----------------
  # 构建机选 ubuntu-22.04（glibc 2.35）：其产物可在 22.04/24.04 及 WSL 上运行；
  # 若选 24.04 构建，glibc 2.39 会导致 22.04 目标机无法运行
  build-linux:
    needs: test
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # PySide6 的 Qt 图形栈在 Linux 上需要的系统库：
      #   libegl1/libgl1   —— libQt6Gui 直接链接（缺 libEGL.so.1 会在 import QtGui 时崩）
      #   libxcb-* 系列    —— xcb 平台插件的运行依赖
      #   libxkbcommon*    —— 键盘映射
      #   libdbus-1-3      —— QtNetwork/桌面集成
      # xvfb 用于无显示环境下做启动冒烟测试
      - name: Install system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libegl1 libgl1 libdbus-1-3 \
            libxkbcommon0 libxkbcommon-x11-0 \
            libxcb-cursor0 libxcb-icccm4 libxcb-keysyms1 \
            libxcb-shape0 libxcb-randr0 libxcb-render-util0 \
            libxcb-xinerama0 libxcb-xkb1 \
            xvfb

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install PySide6-Essentials eltdx pyinstaller websocket-client tzdata

      - name: Use template config for packaging
        run: cp scripts/watchlist_config.example.json scripts/watchlist_config.json

      - name: Build single-file binary
        run: pyinstaller --noconfirm --clean StockMonitor.spec

      - name: Smoke test (二进制能在无显示环境起来吗)
        run: |
          xvfb-run -a bash -c '
            ./dist/StockMonitor &
            APP_PID=$!
            sleep 12
            if kill -0 $APP_PID 2>/dev/null; then
              echo "二进制已稳定运行 12 秒，判定启动正常"
              kill $APP_PID
            else
              echo "进程提前退出，构建产物不可用" >&2
              exit 1
            fi
          '

      - name: Pack tar.gz
        run: |
          tar -czf StockMonitor-linux-x64.tar.gz -C dist StockMonitor
          ls -lh StockMonitor-linux-x64.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: StockMonitor-linux
          path: StockMonitor-linux-x64.tar.gz
          if-no-files-found: error

      - name: Publish Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: StockMonitor-linux-x64.tar.gz
          generate_release_notes: true
